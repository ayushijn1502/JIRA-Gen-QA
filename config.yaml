# AutoTest-Agent Configuration
# Keep real secrets out of git. Set them locally instead, for example:
#   $env:AUTOTEST_JIRA__API_TOKEN = "..."   # PowerShell
#   $env:AUTOTEST_GEMINI__API_KEY = "..."
#   $env:AUTOTEST_GITHUB__TOKEN = "..."
#
# LLM: Google Gemini only (see docs/free-llm-setup.md).

jira:
  url: "https://your-domain.atlassian.net/"
  email: "your-email@example.com"
  api_token: ""

# Free-tier: prefer flash-lite. Docs: https://ai.google.dev/gemini-api/docs/models/gemini
gemini:
  api_key: ""
  model_name: "gemini-2.5-flash-lite"
  max_output_tokens: 8192
  max_total_tokens_per_run: 80000
  run_preflight: true

github:
  enabled: true
  token: ""
  repo: "owner/repo-name"
  base_branch: "main"

rag:
  embedding_model: "all-MiniLM-L6-v2"
  chunk_size: 1500
  chunk_overlap: 200
  top_k: 5

poc:
  enabled: true
  analyze_rag_chunks: 2
  generate_rag_chunks: 2
  max_test_scenarios: 2

target_framework_path: "./target_framework"
docs_path: "./docs"
max_retries: 2
