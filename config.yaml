# Free-tier: prefer flash-lite. Docs: https://ai.google.dev/gemini-api/docs/models/gemini
gemini:
  api_key: "AIzaSyCoDxbiM7-z54hoVkuuFDqtrJah_f0zSbY"
  model_name: "gemini-2.5-flash-lite"
  max_output_tokens: 8192
  max_total_tokens_per_run: 80000
  run_preflight: true

# Enable GitHub delivery when AUTOTEST_GITHUB__TOKEN is exported locally.
github:
  enabled: true
  github_token: ${GITHUB_TOKEN}
  repo: "ayushijn1502/JIRA-Gen-QA"
  base_branch: "master"

rag:
  embedding_model: "all-MiniLM-L6-v2"
  chunk_size: 1500
  chunk_overlap: 200
  top_k: 5

# Two scenarios by default (pos + neg); small RAG windows when enabled.
poc:
  enabled: true
  analyze_rag_chunks: 2
  generate_rag_chunks: 2
  max_test_scenarios: 2

target_framework_path: "./target_framework"
docs_path: "./docs"
max_retries: 2
